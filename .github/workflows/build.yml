name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SagaFrontierBridge.sln

      - name: Build
        run: dotnet build SagaFrontierBridge.sln -c Release --no-restore

      - name: Test
        run: dotnet test SagaFrontierBridge.sln -c Release --no-build
